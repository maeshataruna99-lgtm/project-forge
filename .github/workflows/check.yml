name: Check

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm web:build
      - name: Verify generated starter
        run: |
          generated_dir="$(pnpm --silent smoke:extract)"
          cd "$generated_dir"
          pnpm install
          pnpm build
          pnpm test
          DATABASE_URL='postgresql://USER:PASSWORD@localhost:5432/DATABASE?schema=public' pnpm exec prisma validate --schema prisma/schema.prisma
